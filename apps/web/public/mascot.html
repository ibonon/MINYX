<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MINYX Mascot 3D Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #030712;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #030712;
      z-index: 50;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      margin-top: 14px;
      color: #7dd3fc;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- High-speed offline Three.js and GLTFLoader -->
  <script src="/scripts/three.min.js"></script>
  <script src="/scripts/GLTFLoader.js"></script>
</head>
<body>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div class="status-text" id="status-label">Chargement du compagnon 3D...</div>
  </div>

  <div id="canvas-container"></div>

  <script>
    function notifyRN(msg) {
      if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
        window.ReactNativeWebView.postMessage(JSON.stringify(msg));
      }
    }

    const container = document.getElementById('canvas-container');
    const loadingOverlay = document.getElementById('loading-overlay');
    const statusLabel = document.getElementById('status-label');

    let width = window.innerWidth;
    let height = window.innerHeight;

    // 1. Scene, Camera, Renderer
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(36, width / height, 0.1, 100);
    camera.position.set(0, 0.15, 5.0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    // 2. Balanced Bioluminescent Lighting (Preserving deep contrast and crisp eye reflections)
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xe0f2fe, 1.4);
    keyLight.position.set(2.5, 3.5, 3.5);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x0284c7, 0.6);
    fillLight.position.set(-2.5, -0.5, 2.0);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0x38bdf8, 1.8);
    rimLight.position.set(-3.0, 2.5, -3.0);
    scene.add(rimLight);

    const floorGlow = new THREE.PointLight(0x00e5ff, 1.6, 5);
    floorGlow.position.set(0, -1.5, 0.8);
    scene.add(floorGlow);

    // 3. Holographic Pedestal (Soft animated background ring)
    const pedestalGroup = new THREE.Group();
    pedestalGroup.position.set(0, -1.45, 0);
    pedestalGroup.rotation.x = Math.PI / 2;

    const ringMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.65 });
    const innerRingMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.45 });

    pedestalGroup.add(new THREE.Mesh(new THREE.TorusGeometry(1.65, 0.012, 16, 64), ringMat));
    pedestalGroup.add(new THREE.Mesh(new THREE.TorusGeometry(1.25, 0.010, 16, 48), innerRingMat));
    pedestalGroup.add(new THREE.Mesh(new THREE.TorusGeometry(0.85, 0.008, 16, 36), ringMat));

    scene.add(pedestalGroup);

    // 4. Load the Real 3D Companion GLB
    let modelGroup = null;
    let mixer = null;

    function setupGLB(gltf) {
      modelGroup = gltf.scene;

      // Center and normalize size
      const box = new THREE.Box3().setFromObject(modelGroup);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      const maxDim = Math.max(size.x, size.y, size.z);
      const targetScale = 3.2 / (maxDim || 1);
      modelGroup.scale.set(targetScale, targetScale, targetScale);

      modelGroup.position.x = -center.x * targetScale;
      modelGroup.position.y = -center.y * targetScale - 0.02;
      modelGroup.position.z = -center.z * targetScale;

      // Ensure proper shadows and material properties without clobbering colors
      modelGroup.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          if (child.material) {
            // Keep original colors! Only refine roughness/metalness if needed
            child.material.roughness = Math.min(child.material.roughness ?? 0.25, 0.35);
          }
        }
      });

      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(modelGroup);
        const action = mixer.clipAction(gltf.animations[0]);
        action.play();
      }

      scene.add(modelGroup);

      // Hide loading spinner
      loadingOverlay.style.opacity = '0';
      setTimeout(() => { loadingOverlay.style.display = 'none'; }, 300);

      notifyRN({ type: 'loaded' });
    }

    const loader = new THREE.GLTFLoader();
    loader.load(
      '/models/companion.glb',
      (gltf) => { setupGLB(gltf); },
      undefined,
      (err) => {
        console.warn('Relative load failed, trying absolute:', err);
        loader.load(
          'http://127.0.0.1:3000/models/companion.glb',
          (gltf2) => { setupGLB(gltf2); },
          undefined,
          (err2) => {
            console.error('Failed to load companion.glb:', err2);
            notifyRN({ type: 'error', message: 'Échec de chargement du modèle 3D' });
          }
        );
      }
    );

    // 5. Interactive Touch Drag-to-Rotate (Smooth 360° rotation)
    let isDragging = false;
    let prevX = 0;
    let manualRotY = 0;
    let targetRotY = 0;

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        prevX = e.touches[0].clientX;
      }
    }, { passive: true });

    window.addEventListener('touchend', () => {
      isDragging = false;
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (isDragging && e.touches.length === 1) {
        const deltaX = e.touches[0].clientX - prevX;
        manualRotY += deltaX * 0.016;
        targetRotY = manualRotY;
        prevX = e.touches[0].clientX;
      }
    }, { passive: true });

    // 6. Animation Loop (Breathing + Floating + Floor rotation)
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime();

      // Slow pedestal rotation
      pedestalGroup.rotation.z += delta * 0.22;

      if (mixer) mixer.update(delta);

      if (modelGroup) {
        // Subtle organic breathing float
        modelGroup.position.y += Math.sin(elapsed * 2.2) * delta * 0.06;
        // Smooth rotation damping
        modelGroup.rotation.y += (targetRotY - modelGroup.rotation.y) * 0.12;
      }

      renderer.render(scene, camera);
    }

    animate();

    // 7. Responsive Resizing
    window.addEventListener('resize', () => {
      width = window.innerWidth;
      height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    });
  </script>
</body>
</html>
