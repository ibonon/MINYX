# ============================================================
# MINYX — PostgreSQL (pgvector) + Next.js web (image standalone)
# Les anciens microservices Python (gateway, memory, rl, agentic)
# étaient des squelettes 501 : ils ont été supprimés. Toute la
# logique serveur vit dans apps/web (Next.js route handlers).
#
# Production :
#   cp .env.example .env   # renseigner POSTGRES_PASSWORD, AUTH_SECRET…
#   docker compose up -d --build
#
# Le service `migrate` applique les migrations PostgreSQL puis se
# termine ; `web` ne démarre qu'après sa réussite.
# ============================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:-minyx}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Pas de port exposé publiquement : l'app y accède par le réseau interne.

  # Applique prisma/migrations-postgres puis s'arrête (exit 0).
  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-minyx}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-minyx}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET requis (openssl rand -base64 48)}
      APP_ORIGINS: ${APP_ORIGINS:?APP_ORIGINS requis (ex: minyx.example.com)}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      META_API_KEY: ${META_API_KEY:-}
      META_API_BASE_URL: ${META_API_BASE_URL:-https://api.meta.ai/v1}
      META_TEXT_MODEL: ${META_TEXT_MODEL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
