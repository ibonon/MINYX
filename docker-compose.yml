version: '3.8'

services:
  openclaw-gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    image: minyx/openclaw-gateway:latest
    environment:
      - ISOLATION_MODE=per_user
      - MAX_AGENTS_PER_USER=1
      - MEMORY_BACKEND=memoclaw
      - MEMORY_SERVICE_URL=http://memoclaw:8001
      - RL_ENABLED=true
      - RL_SERVICE_URL=http://openclaw-rl:8002
      - AGENTIC_SERVICE_URL=http://agentic:8003
      - PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - ./agents:/agents
      - ./memory:/memory
    depends_on:
      - memoclaw
      - openclaw-rl
      - agentic
      - postgres
      - redis

  memoclaw:
    build:
      context: ./services/memory
      dockerfile: Dockerfile
    image: minyx/memoclaw:latest
    environment:
      - VECTOR_BACKEND=pgvector # or qdrant
      - POSTGRES_URL=postgresql://minyx:minyxpass@postgres:5432/minyx
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - IMPORTANCE_SCORING=true
      - PORT=8001
    ports:
      - "8001:8001"
    volumes:
      - memoclaw_data:/data
    depends_on:
      - postgres
      - qdrant
      - redis

  openclaw-rl:
    build:
      context: ./services/rl
      dockerfile: Dockerfile
    image: minyx/openclaw-rl:latest
    environment:
      - REWARD_SIGNAL=implicit_feedback
      - UPDATE_FREQUENCY=daily
      - MEMORY_SERVICE_URL=http://memoclaw:8001
      - PORT=8002
    ports:
      - "8002:8002"
    depends_on:
      - memoclaw

  agentic:
    build:
      context: ./services/agentic
      dockerfile: Dockerfile
    image: minyx/agentic:latest
    environment:
      - PORT=8003
      - MEMORY_SERVICE_URL=http://memoclaw:8001
      - X402_NETWORK=base
    ports:
      - "8003:8003"
    depends_on:
      - memoclaw

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=minyx
      - POSTGRES_PASSWORD=minyxpass
      - POSTGRES_DB=minyx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/gateway/schema.sql:/docker-entrypoint-initdb.d/init.sql

  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  memoclaw_data:
